<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Study Tracker</title>

    <style>
        /* 全体のデザイン */
        body {
            background: #20242b;
            color: white;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }

        /* コンテンツの横幅 */
        body > h1,
        body > p,
        body > #timer,
        body > .stats {
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            color: #a78bfa;
            margin-bottom: 30px;
        }

        /* タイマー */
        #timer {
            font-size: 48px;
            font-weight: bold;
            margin-top: 40px;
            margin-bottom: 40px;
            font-variant-numeric: tabular-nums;
        }

        /* 勉強時間のカード */
        .stats {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #303742;
            border-radius: 12px;
            padding: 15px 8px;
            flex: 1;
            min-width: 0;
        }

        .stat-card p {
            font-size: 13px;
            color: #aab4c2;
        }

        .stat-card h2 {
            font-size: 18px;
        }

        /* 共通ボタン */
        button {
            background: #a78bfa;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px 6px;
            font-size: 16px;
            cursor: pointer;
        }

        /* スタート・保存ボタン */
        .main-buttons {
            display: flex;
            gap: 10px;
            max-width: 400px;
            margin: 0 auto;
        }

        .main-buttons button {
            flex: 1;
            min-width: 0;
        }

        #saveButton {
            background: #434b57;
        }

        /* リセットボタン */
        .reset-buttons {
            display: flex;
            gap: 10px;
            max-width: 400px;
            margin: 20px auto 0;
        }

        .reset-buttons button {
            flex: 1;
            min-width: 0;
            padding: 12px 6px;
            font-size: 13px;
            background: transparent;
            border: 1px solid #677283;
        }

        #resetAllButton {
            color: #ff9ca9;
            border-color: #a75b68;
        }

        /*
         * 横画面専用の時計モード
         * スマホの横画面だけに適用
         */
        @media screen and (orientation: landscape)
               and (max-height: 600px) {

            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100dvh;
                overflow: hidden;
                box-sizing: border-box;
            }

            /* タイマー以外を非表示 */
            body > *:not(#timer) {
                display: none !important;
            }

            /* タイマーを画面の中央に配置 */
            #timer {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);

                font-size: clamp(40px, 11vw, 120px);
                font-weight: bold;
                line-height: 1;
                white-space: nowrap;

                width: max-content;
                max-width: none;
                margin: 0;
                text-align: center;
                font-variant-numeric: tabular-nums;
            }
        }
    </style>
</head>

<body>

    <h1>Study Tracker</h1>

    <p>現在の勉強時間</p>

    <div id="timer">00:00:00</div>

    <!-- 勉強時間の表示 -->
    <div class="stats">

        <div class="stat-card">
            <p>今日の勉強</p>
            <h2 id="todayTime">00:00:00</h2>
        </div>

        <div class="stat-card">
            <p>累計勉強時間</p>
            <h2 id="totalTime">00:00:00</h2>
        </div>

    </div>

    <!-- スタート・保存 -->
    <div class="main-buttons">
        <button id="startButton">スタート</button>
        <button id="saveButton">終了・保存</button>
    </div>

    <!-- リセット -->
    <div class="reset-buttons">
        <button id="resetTodayButton">
            今日だけリセット
        </button>

        <button id="resetAllButton">
            全累計リセット
        </button>
    </div>

    <script>
        // =========================
        // タイマーの状態
        // =========================

        let running = false;
        let startTime = 0;
        let elapsedTime = 0;

        // HTMLの部品を取得
        const timer = document.getElementById("timer");
        const startButton =
            document.getElementById("startButton");
        const saveButton =
            document.getElementById("saveButton");

        const todayTime =
            document.getElementById("todayTime");
        const totalTime =
            document.getElementById("totalTime");

        // =========================
        // 時間を表示用に変換
        // =========================

        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes =
                Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);

            return [hours, minutes, secs]
                .map(number =>
                    String(number).padStart(2, "0")
                )
                .join(":");
        }

        // =========================
        // 経過時間を取得
        // =========================

        function getElapsed() {
            if (running) {
                return elapsedTime +
                    (Date.now() - startTime) / 1000;
            }

            return elapsedTime;
        }

        // =========================
        // タイマー表示の更新
        // =========================

        function updateTimer() {
            const newText = formatTime(getElapsed());

            if (timer.textContent !== newText) {
                timer.textContent = newText;
            }
        }

        // =========================
        // 横画面の文字サイズを自動調整
        // =========================

        function adjustTimerSize() {
    const isLandscape = window.matchMedia(
        "(orientation: landscape) and (max-height: 600px)"
    ).matches;

    // 縦画面なら通常表示に戻す
    if (!isLandscape) {
        timer.style.fontSize = "";
        return;
    }

    // まず小さなサイズで文字の実際の幅を測る
    timer.style.fontSize = "40px";

    const textWidth =
        timer.getBoundingClientRect().width;

    // 横幅の88%に収まるように調整
    const availableWidth =
        document.documentElement.clientWidth * 0.88;

    const newSize =
        40 * availableWidth / textWidth;

    // 高さ方向の上限も設定
    const maxHeightSize =
        window.innerHeight * 0.45;

    timer.style.fontSize =
        Math.min(newSize, maxHeightSize) + "px";
}

        // 画面サイズ・向きが変わったら再調整
        window.addEventListener(
            "resize",
            adjustTimerSize
        );

        window.addEventListener(
            "orientationchange",
            adjustTimerSize
        );

        // =========================
        // スタート・一時停止・再開
        // =========================

        startButton.addEventListener(
            "click",
            function() {

                if (running) {
                    elapsedTime = getElapsed();
                    running = false;
                    startButton.textContent = "再開";
                } else {
                    startTime = Date.now();
                    running = true;
                    startButton.textContent = "一時停止";
                }

                updateTimer();
            }
        );

        // =========================
        // 保存データ
        // =========================

        const storageKey = "studyTrackerData";

        let studyData = JSON.parse(
            localStorage.getItem(storageKey) || "{}"
        );

        // 今日の日付を取得
        function getToday() {
            const now = new Date();

            const year = now.getFullYear();
            const month = String(
                now.getMonth() + 1
            ).padStart(2, "0");
            const day = String(
                now.getDate()
            ).padStart(2, "0");

            return `${year}-${month}-${day}`;
        }

        // =========================
        // 今日・累計の表示を更新
        // =========================

        function updateTotals() {
            const today = getToday();

            const todaySeconds =
                studyData[today] || 0;

            const totalSeconds =
                Object.values(studyData).reduce(
                    (sum, seconds) => sum + seconds,
                    0
                );

            todayTime.textContent =
                formatTime(todaySeconds);

            totalTime.textContent =
                formatTime(totalSeconds);
        }

        // =========================
        // 終了・保存
        // =========================

        saveButton.addEventListener(
            "click",
            function() {

                const seconds = getElapsed();

                running = false;
                elapsedTime = 0;

                startButton.textContent = "スタート";

                if (seconds > 0) {
                    const today = getToday();

                    studyData[today] =
                        (studyData[today] || 0) + seconds;

                    localStorage.setItem(
                        storageKey,
                        JSON.stringify(studyData)
                    );
                }

                updateTimer();
                updateTotals();
            }
        );

        // =========================
        // 今日だけリセット
        // =========================

        document.getElementById("resetTodayButton")
            .addEventListener("click", function() {

                if (running || elapsedTime > 0) {
                    alert(
                        "先に「終了・保存」を押してください。"
                    );
                    return;
                }

                if (confirm(
                    "今日の勉強時間をリセットしますか？"
                )) {
                    delete studyData[getToday()];

                    localStorage.setItem(
                        storageKey,
                        JSON.stringify(studyData)
                    );

                    updateTotals();
                }
            });

        // =========================
        // 全累計リセット
        // =========================

        document.getElementById("resetAllButton")
            .addEventListener("click", function() {

                if (running || elapsedTime > 0) {
                    alert(
                        "先に「終了・保存」を押してください。"
                    );
                    return;
                }

                if (confirm(
                    "すべての累計勉強時間をリセットしますか？\n" +
                    "この操作は元に戻せません。"
                )) {
                    studyData = {};

                    localStorage.setItem(
                        storageKey,
                        JSON.stringify(studyData)
                    );

                    updateTotals();
                }
            });

        // =========================
        // 起動時の処理
        // =========================

        updateTimer();
        updateTotals();

        // 100ミリ秒ごとにタイマーを更新
        setInterval(updateTimer, 100);

    </script>
</body>
</html>
