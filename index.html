<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Study Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #20242b;
            color: white;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }

        /* 通常画面 */
        h1,
        body > p,
        #timer,
        .stats,
        .main-buttons,
        .reset-buttons {
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            color: #a78bfa;
            margin-bottom: 30px;
        }

        #timer {
            font-size: 48px;
            font-weight: bold;
            margin-top: 40px;
            margin-bottom: 40px;
            font-variant-numeric: tabular-nums;
        }

        /* 勉強時間カード */
        .stats {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #303742;
            border-radius: 12px;
            padding: 15px 8px;
            flex: 1;
            min-width: 0;
        }

        .stat-card p {
            font-size: 13px;
            color: #aab4c2;
        }

        .stat-card h2 {
            font-size: 18px;
        }

        /* 共通ボタン */
        button {
            background: #a78bfa;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px 6px;
            font-size: 16px;
            cursor: pointer;
        }

        /* スタート・保存 */
        .main-buttons {
            display: flex;
            gap: 10px;
        }

        .main-buttons button {
            flex: 1;
            min-width: 0;
        }

        #saveButton {
            background: #434b57;
        }

        /* リセット */
        .reset-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .reset-buttons button {
            flex: 1;
            min-width: 0;
            padding: 12px 6px;
            font-size: 13px;
            background: transparent;
            border: 1px solid #677283;
        }

        #resetAllButton {
            color: #ff9ca9;
            border-color: #a75b68;
        }

        /*
         * 横画面時計モード
         *
         * 時計を画面中央に固定する。
         * 文字サイズはJavaScriptで安全に調整する。
         */
        @media screen and (orientation: landscape)
               and (max-height: 600px) {

            body {
                width: 100%;
                height: 100dvh;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }

            body > *:not(#timer) {
                display: none !important;
            }

            #timer {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);

                width: max-content;
                max-width: none;
                margin: 0;
                padding: 0;

                font-size: 40px;
                font-weight: bold;
                line-height: 1;
                white-space: nowrap;
                text-align: center;
                font-variant-numeric: tabular-nums;
            }
        }
    </style>
</head>

<body>

    <h1>Study Tracker</h1>

    <p>現在の勉強時間</p>

    <div id="timer">00:00:00</div>

    <!-- 勉強時間カード -->
    <div class="stats">

        <div class="stat-card">
            <p>今日の勉強</p>
            <h2 id="todayTime">00:00:00</h2>
        </div>

        <div class="stat-card">
            <p>累計勉強時間</p>
            <h2 id="totalTime">00:00:00</h2>
        </div>

    </div>

    <!-- スタート・保存ボタン -->
    <div class="main-buttons">
        <button id="startButton">スタート</button>
        <button id="saveButton">終了・保存</button>
    </div>

    <!-- リセットボタン -->
    <div class="reset-buttons">
        <button id="resetTodayButton">
            今日だけリセット
        </button>

        <button id="resetAllButton">
            全累計リセット
        </button>
    </div>

    <script>
        // ==================================
        // 1. タイマーの基本設定
        // ==================================

        let running = false;
        let startTime = 0;
        let elapsedTime = 0;

        const timer =
            document.getElementById("timer");

        const startButton =
            document.getElementById("startButton");

        const saveButton =
            document.getElementById("saveButton");

        const todayTime =
            document.getElementById("todayTime");

        const totalTime =
            document.getElementById("totalTime");


        // ==================================
        // 2. 時間の表示
        // ==================================

        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes =
                Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);

            return [hours, minutes, secs]
                .map(number =>
                    String(number).padStart(2, "0")
                )
                .join(":");
        }


        // ==================================
        // 3. 経過時間の取得
        // ==================================

        function getElapsed() {
            if (running) {
                return elapsedTime +
                    (Date.now() - startTime) / 1000;
            }

            return elapsedTime;
        }


        // ==================================
        // 4. タイマー表示の更新
        // ==================================

        function updateTimer() {
            const display = formatTime(getElapsed());

            if (timer.textContent !== display) {
                timer.textContent = display;
                adjustTimerSize();
            }
        }


        // ==================================
        // 5. 横画面の文字サイズを自動調整
        // ==================================

        function adjustTimerSize() {
    const landscape = window.matchMedia(
        "(orientation: landscape) and (max-height: 600px)"
    ).matches;

    if (!landscape) {
        timer.style.fontSize = "";
        return;
    }

    // まず小さな文字サイズに戻す
    timer.style.fontSize = "40px";

    // 実際に表示された文字の幅を取得
    const actualWidth =
        timer.getBoundingClientRect().width;

    // 画面の横幅の90%を使う
    const availableWidth =
        document.documentElement.clientWidth * 0.90;

    // 文字幅から適切なサイズを計算
    const calculatedSize =
        40 * availableWidth / actualWidth;

    // 高さにも余裕を持たせる
    const maxHeightSize =
        window.innerHeight * 0.65;

    timer.style.fontSize =
        Math.min(calculatedSize, maxHeightSize) + "px";
}

             * 横幅から計算した文字サイズ。
             * 高さの上限も守る。
             */
            const widthBasedSize =
                baseSize * availableWidth / textWidth;

            const newSize = Math.max(
                1,
                Math.min(
                    widthBasedSize,
                    availableHeight
                )
            );

            timer.style.fontSize = newSize + "px";
        }


        // ==================================
        // 6. 画面サイズが変わったら再調整
        // ==================================

        window.addEventListener(
            "resize",
            adjustTimerSize
        );

        window.addEventListener(
            "orientationchange",
            adjustTimerSize
        );


        // ==================================
        // 7. スタート・一時停止・再開
        // ==================================

        startButton.addEventListener(
            "click",
            function() {

                if (running) {
                    elapsedTime = getElapsed();
                    running = false;

                    startButton.textContent = "再開";

                } else {
                    startTime = Date.now();
                    running = true;

                    startButton.textContent = "一時停止";
                }

                updateTimer();
            }
        );


        // ==================================
        // 8. 保存データ
        // ==================================

        const storageKey = "studyTrackerData";

        let studyData = JSON.parse(
            localStorage.getItem(storageKey) || "{}"
        );


        // ==================================
        // 9. 今日の日付
        // ==================================

        function getToday() {
            const now = new Date();

            const year = now.getFullYear();

            const month = String(
                now.getMonth() + 1
            ).padStart(2, "0");

            const day = String(
                now.getDate()
            ).padStart(2, "0");

            return `${year}-${month}-${day}`;
        }


        // ==================================
        // 10. 今日・累計の表示
        // ==================================

        function updateTotals() {

            const today = getToday();

            const todaySeconds =
                studyData[today] || 0;

            const totalSeconds =
                Object.values(studyData)
                    .reduce(
                        (sum, seconds) => sum + seconds,
                        0
                    );

            todayTime.textContent =
                formatTime(todaySeconds);

            totalTime.textContent =
                formatTime(totalSeconds);
        }


        // ==================================
        // 11. 終了・保存
        // ==================================

        saveButton.addEventListener(
            "click",
            function() {

                const seconds = getElapsed();

                running = false;
                elapsedTime = 0;

                startButton.textContent = "スタート";

                if (seconds > 0) {

                    const today = getToday();

                    studyData[today] =
                        (studyData[today] || 0) + seconds;

                    localStorage.setItem(
                        storageKey,
                        JSON.stringify(studyData)
                    );
                }

                updateTimer();
                updateTotals();
            }
        );


        // ==================================
        // 12. 今日だけリセット
        // ==================================

        document.getElementById(
            "resetTodayButton"
        ).addEventListener(
            "click",
            function() {

                if (running || elapsedTime > 0) {
                    alert(
                        "先に「終了・保存」を押してください。"
                    );
                    return;
                }

                if (confirm(
                    "今日の勉強時間をリセットしますか？"
                )) {

                    delete studyData[getToday()];

                    localStorage.setItem(
                        storageKey,
                        JSON.stringify(studyData)
                    );

                    updateTotals();
                }
            }
        );


        // ==================================
        // 13. 全累計リセット
        // ==================================

        document.getElementById(
            "resetAllButton"
        ).addEventListener(
            "click",
            function() {

                if (running || elapsedTime > 0) {
                    alert(
                        "先に「終了・保存」を押してください。"
                    );
                    return;
                }

                if (confirm(
                    "すべての累計勉強時間をリセットしますか？\nこの操作は元に戻せません。"
                )) {

                    studyData = {};

                    localStorage.setItem(
                        storageKey,
                        JSON.stringify(studyData)
                    );

                    updateTotals();
                }
            }
        );


        // ==================================
        // 14. 起動時の処理
        // ==================================

        updateTotals();
        updateTimer();
        adjustTimerSize();

        // 100ミリ秒ごとにタイマー更新
        setInterval(updateTimer, 100);

    </script>

</body>
</html>
